name: Publish release

# Runs when a GitHub Release is published. Publishes the npm package.
on:
  release:
    types: [published]

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for --provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-agent:
    name: Publish agent to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for --provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bundles src/agent + the engine into a single self-contained
      # agent/dist/index.cjs (no prior `npm run build` needed).
      - name: Build agent bundle
        run: npm run build:agent

      - name: Publish agent to npm
        run: npm publish --provenance --access public
        working-directory: agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}