name: Build Desktop Apps

# Builds the macOS and Windows executables and attaches them to the GitHub
# Release that triggered the run. Each binary is built on its native OS, then
# uploaded explicitly to the triggering release (rather than relying on
# electron-builder's auto-publish, which targets a draft release).
on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            name: Windows
            args: --win
            files: |
              dist/*.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # required to upload assets to the release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Package executable
        run: npx electron-builder ${{ matrix.args }} --config electron-builder.config.cjs --publish never
        env:
          # Azure Trusted Signing — consumed only by the Windows job (mac ignores
          # them). Signing activates only when these are set; otherwise the build
          # is unsigned, exactly as before. See electron-builder.config.cjs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
