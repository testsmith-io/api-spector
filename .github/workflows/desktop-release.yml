name: Build Desktop App

# Builds the native installers and attaches them to the GitHub Release that
# triggered the run:
#   - Windows: code-signed .exe (Azure Trusted Signing), also published to Chocolatey
#   - Linux:   AppImage + .deb
# macOS is distributed via the npm package (which runs under Electron's own
# notarized binary), so no .dmg is built here.
on:
  release:
    types: [published]

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write # required to upload assets to the release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Package signed installer
        run: npx electron-builder --win --config electron-builder.config.cjs --publish never
        env:
          # Azure Trusted Signing. Signing activates only when these are set;
          # otherwise the build is unsigned. See electron-builder.config.cjs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}

      - name: List build output
        run: Get-ChildItem dist | Select-Object Name, Length
        shell: pwsh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          # latest.yml + *.blockmap are what electron-updater reads to detect and
          # download updates in-app — they must be attached alongside the .exe.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.zip
          fail_on_unmatched_files: true

  linux:
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload assets to the release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Package AppImage + .deb
        run: npx electron-builder --linux --config electron-builder.config.cjs --publish never

      - name: List build output
        run: ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: true

  # Publish the Windows package to the Chocolatey Community Repository. Runs after
  # the Windows installer is attached to the release (needs: windows), downloads it
  # to hash exactly what users will download, then packs and pushes. The first
  # version of the package is human-moderated by Chocolatey; later ones auto-approve.
  # Skipped for pre-releases and when no CHOCO_API_KEY secret is set.
  chocolatey:
    name: Chocolatey
    needs: windows
    runs-on: windows-latest  # choco is pre-installed on GitHub's Windows runners
    if: ${{ !github.event.release.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Pack + push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Host 'CHOCO_API_KEY not set; skipping Chocolatey publish.'
            exit 0
          }

          $version = '${{ github.event.release.tag_name }}'
          $exe = "API-Spector-Setup-$version.exe"
          $url = "https://github.com/testsmith-io/api-spector/releases/download/$version/$exe"

          # Hash the just-released signed installer so the package's install-time
          # checksum matches exactly what users download from GitHub Releases.
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256 = $sha"

          # Inject the checksum into the install script (the committed copy keeps the
          # __CHECKSUM64__ placeholder; this edit is ephemeral to the CI checkout).
          $script = 'packaging/chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $script) -replace '__CHECKSUM64__', $sha | Set-Content $script

          Push-Location packaging/chocolatey
          choco pack api-spector.nuspec --version $version
          # GitHub Actions masks the secret in logs; --api-key is safe here.
          choco push "api-spector.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          Pop-Location
