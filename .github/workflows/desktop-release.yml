name: Build Desktop App

# Builds the signed Windows installer and attaches it to the GitHub Release
# that triggered the run. macOS/Linux are distributed via the npm package
# (which runs under Electron's own notarized binary), so no native bundles are
# built here — only the code-signed Windows .exe.
on:
  release:
    types: [published]

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write # required to upload assets to the release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Package signed installer
        run: npx electron-builder --win --config electron-builder.config.cjs --publish never
        env:
          # Azure Trusted Signing. Signing activates only when these are set;
          # otherwise the build is unsigned. See electron-builder.config.cjs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}

      - name: List build output
        run: Get-ChildItem dist | Select-Object Name, Length
        shell: pwsh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          # latest.yml + *.blockmap are what electron-updater reads to detect and
          # download updates in-app — they must be attached alongside the .exe.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.zip
          fail_on_unmatched_files: true
