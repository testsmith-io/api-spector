    .box{fill:#ffffff;stroke:#d5dae2;stroke-width:1.5}.acc{fill:#e7eeff;stroke:#2f62ff;stroke-width:1.5}
    .pass{fill:#e4f4ec;stroke:#0f8a56;stroke-width:1.3}.fail{fill:#fbe9e7;stroke:#cf4038;stroke-width:1.3}
    .panel{fill:#f0f2f6;stroke:#d5dae2;stroke-width:1.5}
  </style>

  <text x="14" y="18" class="h">DESKTOP APP / CI</text>
  <text x="360" y="18" class="h" fill="#2f62ff">API SPECTOR CLOUD</text>
  <text x="700" y="18" class="h">CI / CD</text>
  <line x1="344" y1="28" x2="344" y2="186" stroke="#e3e7ee" stroke-dasharray="3 5"/>
  <line x1="686" y1="28" x2="686" y2="186" stroke="#e3e7ee" stroke-dasharray="3 5"/>

  <rect x="14" y="78" width="150" height="54" rx="9" class="box"/><text x="89" y="101" text-anchor="middle" class="t">Author</text><text x="89" y="118" text-anchor="middle" class="s">Contract tab + OpenAPI</text>
  <rect x="186" y="78" width="140" height="54" rx="9" class="box"/><text x="256" y="101" text-anchor="middle" class="t">Publish</text><text x="256" y="118" text-anchor="middle" class="s">pact + spec</text>
  <rect x="360" y="78" width="150" height="54" rx="9" class="acc"/><text x="435" y="101" text-anchor="middle" class="t" fill="#2f62ff">Verify · BDCT</text><text x="435" y="118" text-anchor="middle" class="s">pact vs spec</text>
  <rect x="530" y="78" width="140" height="54" rx="9" class="box"/><text x="600" y="101" text-anchor="middle" class="t">Matrix</text><text x="600" y="118" text-anchor="middle" class="s">green / red + coverage</text>
  <rect x="700" y="78" width="70" height="54" rx="9" class="box"/><text x="735" y="99" text-anchor="middle" class="t">Gate</text><text x="735" y="116" text-anchor="middle" class="s">can-i-deploy</text>
  <rect x="782" y="78" width="66" height="54" rx="9" class="box"/><text x="815" y="99" text-anchor="middle" class="t">Record</text><text x="815" y="116" text-anchor="middle" class="s">deploy</text>

  <path d="M164,105 L184,105" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M326,105 L358,105" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M510,105 L528,105" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M670,105 L698,105" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M770,105 L780,105" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

