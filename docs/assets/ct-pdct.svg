<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#616b7a"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45611"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a3ff2"/></marker>
  </defs>
  <style>
    .t{font-size:12.5px;font-weight:600;fill:#171b22}.s{font-size:10.5px;fill:#616b7a}
    .box{fill:#ffffff;stroke:#d5dae2;stroke-width:1.5}.acc{fill:#e7eeff;stroke:#2f62ff;stroke-width:1.5}
    .cons{fill:#fbf0e6;stroke:#b45611;stroke-width:1.5}.prov{fill:#efeafe;stroke:#6a3ff2;stroke-width:1.5}
    .pass{fill:#e4f4ec;stroke:#0f8a56;stroke-width:1.3}.fail{fill:#fbe9e7;stroke:#cf4038;stroke-width:1.3}
  </style>

  <rect x="16" y="98" width="180" height="52" rx="9" class="prov"/>
  <text x="106" y="120" text-anchor="middle" class="t" fill="#6a3ff2">Provider publishes</text>
  <text x="106" y="138" text-anchor="middle" class="s">Toolshop OpenAPI</text>

  <rect x="352" y="16" width="200" height="46" rx="9" class="acc"/>
  <text x="452" y="37" text-anchor="middle" class="t" fill="#2f62ff">Mock from spec</text>
  <text x="452" y="54" text-anchor="middle" class="s">develop against it</text>

  <rect x="352" y="180" width="200" height="46" rx="9" class="acc"/>
  <text x="452" y="201" text-anchor="middle" class="t" fill="#2f62ff">Conformance check</text>
  <text x="452" y="218" text-anchor="middle" class="s">consumer ⊆ spec</text>

  <rect x="640" y="98" width="200" height="52" rx="9" class="cons"/>
  <text x="740" y="120" text-anchor="middle" class="t" fill="#b45611">Consumer</text>
  <text x="740" y="138" text-anchor="middle" class="s">stays within the spec</text>

  <path d="M196,116 C280,90 300,60 350,45" stroke="#6a3ff2" stroke-width="1.5" fill="none" marker-end="url(#ap)"/><text x="250" y="78" class="s">generate</text>
  <path d="M196,132 C280,158 300,190 350,203" stroke="#6a3ff2" stroke-width="1.5" fill="none" marker-end="url(#ap)"/><text x="250" y="185" class="s">check against</text>

  <path d="M552,42 C610,42 630,95 640,112" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="600" y="70" class="s">dev + test</text>
  <path d="M552,203 C610,203 630,150 640,136" stroke="#616b7a" stroke-width="1.5" fill="none" marker-end="url(#ac)"/>

  <rect x="380" y="118" width="52" height="22" rx="6" class="pass"/><text x="406" y="133" text-anchor="middle" class="s" fill="#0f8a56">200</text>
  <rect x="440" y="118" width="120" height="22" rx="6" class="fail"/><text x="500" y="133" text-anchor="middle" class="s" fill="#cf4038">out-of-spec = 404</text>
</svg>
